<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Подтверждение email</title>
</head>
<body style="margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif;font-size:16px;line-height:1.5;color:#1e293b;background:#f8fafc;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f8fafc;padding:24px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:12px;padding:32px 28px;box-shadow:0 1px 3px rgba(15,23,42,.08);">
          <tr>
            <td>
              <p style="margin:0 0 16px;">Здравствуйте!</p>
              <p style="margin:0 0 16px;">
                Чтобы подтвердить адрес <strong>{{ recipient_email }}</strong>, нажмите кнопку ниже.
              </p>
              <p style="margin:24px 0;text-align:center;">
                <a href="{{ verification_url }}"
                   style="display:inline-block;padding:12px 24px;background:#0f172a;color:#f8fafc;text-decoration:none;border-radius:8px;font-weight:600;">
                  Подтвердить email
                </a>
              </p>
              <p style="margin:0 0 12px;font-size:14px;color:#64748b;">
                Если кнопка не работает, скопируйте ссылку в браузер:
              </p>
              <p style="margin:0 0 20px;font-size:13px;word-break:break-all;color:#334155;">
                <a href="{{ verification_url }}" style="color:#2563eb;">{{ verification_url }}</a>
              </p>
              <p style="margin:0;font-size:14px;color:#64748b;">
                Ссылка действует ограниченное время. Если вы не регистрировались, проигнорируйте это письмо.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
