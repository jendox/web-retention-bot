[project]
name = "retention-telegram-bot"
version = "0.1.0"
description = "Lightweight Telegram sidecar for Retention Studio"
requires-python = ">=3.13"
dependencies = [
    "starlette>=0.41,<1",
    "uvicorn[standard]>=0.32,<1",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
