[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web-retention-bot"
version = "0.1.0"
description = "Appointment scheduling SaaS (FastAPI backend + React frontend)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "redis[hiredis]>=5.2,<6",
    "pydantic-settings>=2.6,<3",
    "pwdlib[argon2]>=0.2,<1",
    "python-multipart>=0.0.17,<1",
    "email-validator>=2,<3",
    "celery[redis]>=5.4,<6",
    "aiosmtplib>=5.1.0,<6",
    "jinja2>=3.1.6,<4"
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
    "aiosqlite>=0.21,<1",
    "ruff>=0.11,<1",
    "celery-types>=0.26.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/app/api/deps.py" = ["B008"]
"src/app/migrations/**/*.py" = ["E501", "UP035", "UP007", "I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
pythonpath = ["src"]
testpaths = ["tests"]
