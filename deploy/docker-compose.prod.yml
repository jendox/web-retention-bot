name: retention-prod

x-app: &app
  build:
    context: ..
    dockerfile: Dockerfile
  env_file:
    - ${RETENTION_ENV_FILE:-prod.env}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging: &default-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retention}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/prod.env}
      POSTGRES_DB: ${POSTGRES_DB:-retention}
    volumes:
      - retention_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - retention_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  migrate:
    <<: *app
    restart: "no"
    profiles: ["tools"]
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]

  api:
    <<: *app
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *app
    restart: unless-stopped
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-l", "info"]

  beat:
    <<: *app
    restart: unless-stopped
    command:
      [
        "celery",
        "-A",
        "app.worker.celery_app",
        "beat",
        "-l",
        "info",
        "--schedule",
        "/app/runtime/celerybeat-schedule",
      ]

  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.caddy
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in deploy/prod.env}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - retention_caddy_data:/data
      - retention_caddy_config:/config
    logging: *default-logging

volumes:
  retention_pgdata:
  retention_redisdata:
  retention_caddy_data:
  retention_caddy_config:
