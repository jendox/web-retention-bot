# Lightweight messenger sidecars (separate images, no FastAPI app code).
# Run from repo root: docker compose -f deploy/docker-compose.bots.yml up -d
# Requires backend reachable at RETENTION_API_URL (default: host machine :8000).

services:
  telegram-bot:
    build:
      context: ../bots
      dockerfile: telegram/Dockerfile
    container_name: retention-telegram-bot
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}
      BOT_INTERNAL_SECRET: ${MESSENGER_BOTS__INTERNAL_SECRET:-dev-bot-internal-secret-change-me}
      RETENTION_API_URL: ${RETENTION_API_URL:-http://host.docker.internal:8000}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-polling}
      LISTEN_PORT: "8091"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8091:8091"
    mem_limit: 128m
    cpus: 0.5

  viber-bot:
    build:
      context: ../bots
      dockerfile: viber/Dockerfile
    container_name: retention-viber-bot
    restart: unless-stopped
    profiles:
      - viber
    environment:
      VIBER_AUTH_TOKEN: ${VIBER_AUTH_TOKEN:-}
      BOT_INTERNAL_SECRET: ${MESSENGER_BOTS__INTERNAL_SECRET:-dev-bot-internal-secret-change-me}
      RETENTION_API_URL: ${RETENTION_API_URL:-http://host.docker.internal:8000}
      LISTEN_PORT: "8092"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8092:8092"
    mem_limit: 128m
    cpus: 0.5
